<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colegio San Jose 3° GRADO</title>
<style>
  :root{--verde:#1F7A4D;--naranja:#B8430A;--azul:#1F5F8B;--rojo:#B3261E;--tinta:#1b1b1b;--fondo:#F6F8F4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
  header{background:var(--verde);color:#fff;text-align:center;padding:18px 16px}
  h1{margin:0;font-size:clamp(26px,6vw,44px);line-height:1.1}
  .sub{margin:14px 16px 0;text-align:center;font-size:clamp(17px,3.8vw,21px);font-weight:bold}
  main{max-width:1100px;margin:0 auto;padding:16px 16px 32px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .tarjeta{background:#fff;border:4px solid var(--azul);border-radius:20px;padding:14px;
    display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
  .tarjeta.ok{border-color:var(--verde)} .tarjeta.mal{border-color:var(--rojo)}
  .num{font-weight:bold;color:var(--azul);font-size:16px}
  .foto{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px}
  .opciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opciones button{font:inherit;font-weight:bold;font-size:clamp(16px,3.6vw,19px);min-height:54px;padding:8px 6px;
    border-radius:14px;border:3px solid var(--azul);background:#fff;color:var(--azul);cursor:pointer}
  .opciones button:hover:not(:disabled),.opciones button:focus-visible{background:var(--azul);color:#fff}
  .opciones button:disabled{cursor:default;opacity:.55}
  .opciones button.correcta{background:var(--verde);border-color:var(--verde);color:#fff;opacity:1}
  .opciones button.incorrecta{background:var(--rojo);border-color:var(--rojo);color:#fff;opacity:1}
  .fin{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
  .fin[hidden]{display:none}
  .caja{background:#fff;border-radius:24px;padding:28px 24px;max-width:460px;width:100%;text-align:center;border:6px solid var(--verde)}
  .caja.perdio{border-color:var(--rojo)}
  .cara{font-size:84px;line-height:1}
  .mensaje{margin:12px 0 20px;font-size:clamp(28px,7vw,40px);font-weight:bold;color:var(--verde)}
  .perdio .mensaje{color:var(--rojo)}
  .caja button{font:inherit;font-weight:bold;font-size:20px;min-height:54px;padding:10px 26px;border-radius:999px;
    border:0;background:var(--naranja);color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><h1>Colegio San Jose 3° GRADO</h1></header>
<p class="sub">¿Qué parte de la computadora es? Elegí el nombre correcto en las 3 tarjetas.</p>
<main id="mesa"></main>
<div class="fin" id="fin" hidden>
  <div class="caja" id="caja" role="alertdialog" aria-labelledby="mensaje">
    <div class="cara" id="cara" aria-hidden="true"></div>
    <p class="mensaje" id="mensaje"></p>
    <button type="button" id="reiniciar"></button>
  </div>
</div>

var EXTRAS = ["Celular","Tablet","Escáner","Joystick","Televisor"];
var ronda = [], aciertos = 0;
var mesa = document.getElementById("mesa"), fin = document.getElementById("fin");

function mezclar(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function terminar(gano){
  document.getElementById("caja").className = gano ? "caja" : "caja perdio";
  document.getElementById("cara").textContent = gano ? "🎉" : "😢";
  document.getElementById("mensaje").textContent = gano ? "Felicitaciones!! Ganaste!!" : "Fallaste";
  document.getElementById("reiniciar").textContent = gano ? "Volver a iniciar" : "Volver a empezar";
  mesa.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
  fin.hidden = false;
  document.getElementById("reiniciar").focus();
}

function iniciar(){
  fin.hidden = true; aciertos = 0; mesa.innerHTML = "";
  ronda = mezclar(PARTES).slice(0, 3);
  ronda.forEach(function(parte, i){
    var otros = PARTES.map(function(p){ return p.n; }).concat(EXTRAS)
      .filter(function(n){ return n !== parte.n; });
    var opciones = mezclar([parte.n].concat(mezclar(otros).slice(0, 3)));
    var t = document.createElement("section");
    t.className = "tarjeta";
    t.innerHTML = '<div class="num">Tarjeta ' + (i + 1) + ' de 3</div>' +
      '<img class="foto" alt="Foto de una parte de la computadora" src="' + parte.img + '">' +
      '<div class="opciones"></div>';
    var caja = t.querySelector(".opciones");
    opciones.forEach(function(texto){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = texto;
      b.addEventListener("click", function(){
        caja.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
        if (texto === parte.n){
          b.classList.add("correcta"); t.classList.add("ok"); aciertos++;
          if (aciertos === 3) terminar(true);
        } else {
          b.classList.add("incorrecta"); t.classList.add("mal"); terminar(false);
        }
      });
      caja.appendChild(b);
    });
    mesa.appendChild(t);
  });
}

document.getElementById("reiniciar").addEventListener("click", iniciar);
iniciar();
</script>
